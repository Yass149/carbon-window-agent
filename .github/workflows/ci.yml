name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[dev,anthropic]'
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=cwa --cov-report=term-missing --cov-fail-under=80
      - run: python -m evals.run_eval
