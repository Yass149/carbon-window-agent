[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-window-agent"
version = "0.1.0"
description = "Tested tools for choosing low-carbon electricity windows in Great Britain"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1", "pydantic>=2,<3", "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1", "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "respx>=0.21,<1", "ruff>=0.11,<1", "mypy>=1.10,<2", "pytest-cov>=5,<7"]
anthropic = ["anthropic>=0.40,<1"]
ui = ["streamlit>=1.41,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
