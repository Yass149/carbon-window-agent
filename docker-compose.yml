services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PROVIDER: ${PROVIDER:-demo}
      ALLOW_PAID_API: ${ALLOW_PAID_API:-false}
      DB_PATH: /app/data/cwa.sqlite3
    volumes:
      - cwa-data:/app/data
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    profiles: ["ui"]
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      CWA_API_URL: http://api:8000
volumes:
  cwa-data:
