services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      PROVIDER: ${PROVIDER:-demo}
      ALLOW_PAID_API: ${ALLOW_PAID_API:-false}
      DB_PATH: /app/data/cwa.sqlite3
    volumes:
      - cwa-data:/app/data
volumes:
  cwa-data:
